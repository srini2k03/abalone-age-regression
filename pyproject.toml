[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abalone-age-regression"
version = "1.0.0"
description = "Predict abalone age (ring count) from morphometric measurements with a cross-validated, RMSLE-optimised ML pipeline."
readme = "README.md"
license = "MIT"
authors = [{ name = "Srinivasan Balasubramanian" }]
requires-python = ">=3.10"
keywords = ["machine-learning", "regression", "abalone", "xgboost", "catboost", "scikit-learn"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "xgboost<3.1; python_version < \"3.11\"",  # shap releases for 3.10 cannot parse newer model dumps
  "catboost>=1.2",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "typer>=0.12",
  "joblib>=1.3",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
tune = ["optuna>=3.5"]
explain = ["shap>=0.44", "matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mlflow = ["mlflow>=2.10"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.4", "nbformat>=5.9"]
all = ["abalone-age-regression[lightgbm,tune,explain,api,dev]"]

[project.scripts]
abalone = "abalone.cli:main"

[project.urls]
Homepage = "https://github.com/srini2k03/abalone-age-regression"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: tests that fit gradient-boosted models"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF"]
ignore = ["N803", "N806", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/abalone/cli.py" = ["B008"]
"notebooks/*" = ["E501"]

[tool.coverage.run]
source = ["abalone"]
